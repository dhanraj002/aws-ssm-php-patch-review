name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Offline demo retains incomplete hosts
        shell: bash
        run: |
          set +e
          python inventory.py --fixture examples/inventory-demo.json --output reports/demo
          result=$?
          set -e
          test "$result" -eq 2
          python -c "import json; d=json.load(open('reports/demo/review.json')); assert len(d['rows']) == 7; assert sum(r['assessment'] == 'SCAN_INCOMPLETE' for r in d['rows']) == 2"
      - name: Prepare fixed inventory document without AWS
        run: python prepare_inventory.py --output reports/PHP-Inventory.json
